<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Viewport frame</title><style>html,body{margin:0;padding:0;overflow:hidden;width:var(--viewport-width);height:var(--viewport-height)}iframe{display:block;width:var(--viewport-width);height:var(--viewport-height);border:0}</style></head><body><iframe id="app" title="App viewport"></iframe><script>const p=new URLSearchParams(location.search);const w=Number(p.get('w')||390),h=Number(p.get('h')||844);document.documentElement.style.setProperty('--viewport-width',w+'px');document.documentElement.style.setProperty('--viewport-height',h+'px');document.querySelector('#app').src='/';</script></body></html>
